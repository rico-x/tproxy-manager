# Роль: входящие подключения. Соответствует xray 02_inbounds.json:
# socks на 10808 и TPROXY на 61219 для tcp и udp.
allow-lan: false
bind-address: 127.0.0.1
mixed-port: 10808
tproxy-port: 61219
sniffer:
  enable: true
  sniff:
    HTTP: { ports: [80, 8080-8880] }
    TLS: { ports: [443, 8443] }
    QUIC: { ports: [443, 8443] }
