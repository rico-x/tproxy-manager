# Роль 04 — подключение управляемого источника и группа.
#
# У Mihomo этот файл не содержит управляемое подключение, а ССЫЛАЕТСЯ на него:
# провайдер типа file читает `tproxy-manager-proxies.yaml` — единственный файл,
# который перезаписывает пакет (mihomo_profile_managed_file). Путь относительный
# и разрешается от рабочего каталога ядра, поэтому ядро обязано запускаться с
# `-d /etc/mihomo`.
#
# Имя группы `proxy` совпадает с тегом управляемого outbound у Xray и sing-box,
# поэтому завершающее правило маршрутизации читается одинаково во всех трёх ядрах.
proxy-providers:
  tproxy-manager:
    type: file
    path: ./tproxy-manager-proxies.yaml
    health-check:
      enable: false
      interval: 600
      url: http://cp.cloudflare.com/generate_204
proxy-groups:
  - name: proxy
    type: select
    use:
      - tproxy-manager
