# Layout of the Mihomo batch probe config: one listener per link, each pinned to
# its own proxy, all in one process. The three placeholders below are filled by
# proxy2mihomo.lua --batch.
#
# Do not name a placeholder anywhere else in this file, not even in a comment:
# substitution is literal and would paste a whole YAML block into the prose.
#
# Keep the rules a DIRECT default: a listener whose proxy binding is not honoured
# then fails its probe instead of quietly measuring a direct connection and
# reporting the link alive.
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: warning
ipv6: true
listeners:
__BATCH_INBOUNDS__
proxies:
__BATCH_PROXIES__
rules:
__BATCH_RULES__
